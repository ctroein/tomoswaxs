<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beamline selection editor</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0d1420;color:#e8eef6;font:14px Arial,sans-serif}*{box-sizing:border-box}.editor{height:100dvh;display:flex;flex-direction:column}.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #33465a}.toolbar strong{margin-right:auto}.view-buttons{display:flex;gap:6px}button,input,select,textarea{font:inherit;color:inherit}button,select{background:#253449;border:1px solid #60718a;border-radius:4px;padding:5px 9px}button{cursor:pointer}button:hover{background:#354b66}.content{display:grid;grid-template-columns:minmax(0,1fr) 430px;min-height:0;flex:1}.plot-pane{position:relative;min-height:0;min-width:0}.plot-pane>div{height:100%}#model{height:100%!important;width:100%!important}.sidebar{padding:16px;overflow:auto;border-left:1px solid #33465a;display:flex;flex-direction:column;gap:16px}.sidebar fieldset{border:0;padding:0;margin:0;min-width:0}.region-row{display:flex;align-items:center;gap:9px;margin-bottom:14px}.region-row select{flex:1}.swatch{width:12px;height:12px;border-radius:3px}.caption{margin:0 0 12px;color:#bccbda}.axis-head{display:grid;grid-template-columns:18px 80px minmax(70px,1fr) 80px;gap:8px;text-align:center;color:#bccbda;margin-bottom:5px}.axis-row{display:grid;grid-template-columns:18px 80px minmax(70px,1fr) 80px;align-items:center;gap:8px;margin:12px 0}.axis-row input[type=number]{width:100%;min-width:0;background:#111d2c;border:1px solid #60718a;border-radius:4px;padding:6px 4px;font-variant-numeric:tabular-nums}.range-pair{height:24px;position:relative}.rail,.fill{position:absolute;height:4px;top:10px;border-radius:2px}.rail{left:0;right:0;background:#52637a}.range-pair input[type=range]{position:absolute;inset:0;width:100%;height:24px;margin:0;appearance:none;background:transparent;pointer-events:none;outline:none}.range-pair input::-webkit-slider-thumb{appearance:none;width:13px;height:13px;background:var(--region-colour);border:0;border-radius:50%;pointer-events:auto;cursor:ew-resize}.range-pair input::-moz-range-thumb{width:13px;height:13px;background:var(--region-colour);border:0;border-radius:50%;pointer-events:auto;cursor:ew-resize}.range-pair input:focus-visible::-webkit-slider-thumb{outline:2px solid #e8eef6;outline-offset:2px}.range-pair input:focus-visible::-moz-range-thumb{outline:2px solid #e8eef6;outline-offset:2px}.actions{display:flex;gap:8px;flex-wrap:wrap}.export-title{display:flex;align-items:center;gap:8px;margin-bottom:10px}.export-title label{margin-right:auto}textarea{display:block;width:100%;min-height:220px;resize:vertical;background:#111d2c;border:1px solid #60718a;border-radius:4px;padding:9px;font-family:monospace;font-size:12px;line-height:1.45}.note{margin:0;color:#bccbda;line-height:1.45}#status{min-height:18px;margin:0;color:#f5c775}button:disabled,fieldset:disabled{opacity:.5}@media(max-width:1000px){html,body{overflow:auto}.editor{height:auto;min-height:100dvh}.content{display:flex;flex-direction:column}.plot-pane{height:60vh;min-height:400px}.sidebar{border-left:0;border-top:1px solid #33465a}.toolbar{gap:10px}}</style></head><body><div class="editor"><header class="toolbar"><strong>Beamline selection editor</strong><div class="view-buttons"><button id="detail">Selected box</button><button id="side">Side view</button><button id="overview">Whole model</button></div><label><input id="ghost" type="checkbox"> Faint surroundings</label><label><input id="boxes" type="checkbox" checked> Box outlines</label></header><main class="content"><section class="plot-pane">$plot</section><aside class="sidebar"><fieldset id="controls" disabled><div class="region-row"><span id="region-swatch" class="swatch"></span><label for="region">Box</label><select id="region"></select></div><p class="caption">Bounds in CAD coordinates (mm)</p><div class="axis-head"><span></span><span>Lower</span><span></span><span>Upper</span></div><div class="axis-row"><label for="number-0-0">X</label><input id="number-0-0" type="number" step="any" aria-label="X lower bound"><div class="range-pair"><div class="rail"></div><div id="fill-0" class="fill"></div><input id="range-0-0" type="range" step="1" aria-label="X lower bound slider"><input id="range-0-1" type="range" step="1" aria-label="X upper bound slider"></div><input id="number-0-1" type="number" step="any" aria-label="X upper bound"></div><div class="axis-row"><label for="number-1-0">Y</label><input id="number-1-0" type="number" step="any" aria-label="Y lower bound"><div class="range-pair"><div class="rail"></div><div id="fill-1" class="fill"></div><input id="range-1-0" type="range" step="1" aria-label="Y lower bound slider"><input id="range-1-1" type="range" step="1" aria-label="Y upper bound slider"></div><input id="number-1-1" type="number" step="any" aria-label="Y upper bound"></div><div class="axis-row"><label for="number-2-0">Z</label><input id="number-2-0" type="number" step="any" aria-label="Z lower bound"><div class="range-pair"><div class="rail"></div><div id="fill-2" class="fill"></div><input id="range-2-0" type="range" step="1" aria-label="Z lower bound slider"><input id="range-2-1" type="range" step="1" aria-label="Z upper bound slider"></div><input id="number-2-1" type="number" step="any" aria-label="Z upper bound"></div><div class="actions"><button id="reset-box">Reset this box</button><button id="reset-all">Reset all</button></div></fieldset><p class="note">Z is vertical. Highlighting follows the inclusion boxes.</p><div><div class="export-title"><label for="coordinates">Coordinates</label><button id="copy">Copy</button><button id="save">Save JSON</button></div><textarea id="coordinates" readonly spellcheck="false" aria-label="Selection coordinates"></textarea></div><p id="status" role="status" aria-live="polite">Loading editor…</p></aside></main></div><script id="selection-config" type="application/json">$config</script><script>$script</script></body></html>
